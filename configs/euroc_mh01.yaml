# EuRoC MAV MH_01_easy Sensor Configuration & Calibration
dataset_name: "EuRoC_MH_01_easy"

# Camera Calibration (cam0)
cam0:
  camera_model: "pinhole"
  intrinsics: [458.654, 437.283, 367.215, 248.375] # [fx, fy, cx, cy]
  resolution: [752, 480] # [w, h]
  distortion_model: "radtan"
  distortion_coeffs: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]
  # T_B_C0: Transform from cam0 to body (IMU) frame: p_B = T_B_C0 * p_C0
  T_B_C: [
    [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975],
    [0.999557245308, 0.0149672133247, 0.025715529948, -0.064676986768],
    [-0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949],
    [0.0, 0.0, 0.0, 1.0]
  ]

# Camera Calibration (cam1)
cam1:
  camera_model: "pinhole"
  intrinsics: [457.587, 436.120, 379.999, 255.238] # [fx, fy, cx, cy]
  resolution: [752, 480]
  distortion_model: "radtan"
  distortion_coeffs: [-0.28368365, 0.07451284, -0.00010473, -3.55590700e-05]
  # T_B_C1: Transform from cam1 to body (IMU) frame
  T_B_C: [
    [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579552],
    [0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024],
    [-0.0253898008918, 0.0179005838251, 0.999517347078, 0.00786212792949],
    [0.0, 0.0, 0.0, 1.0]
  ]

# IMU Noise Characteristics
imu:
  rate_hz: 200.0
  gyro_noise_density: 1.6968e-04     # [rad / s / sqrt(Hz)] (sigma_g)
  gyro_random_walk: 1.9393e-05       # [rad / s^2 / sqrt(Hz)] (sigma_bg)
  accel_noise_density: 2.0000e-03    # [m / s^2 / sqrt(Hz)] (sigma_a)
  accel_random_walk: 3.0000e-03      # [m / s^3 / sqrt(Hz)] (sigma_ba)
  gravity: [0.0, 0.0, -9.81]         # Gravity vector in world frame [m/s^2]

# Visual Frontend Parameters
frontend:
  rate_hz: 20.0
  max_features: 250
  grid_rows: 6
  grid_cols: 8
  min_distance: 12
  quality_level: 0.01
  max_epipolar_err_px: 1.5
  stereo_baseline_m: 0.11007
  ransac_reproj_err: 2.5
  min_inliers_for_update: 15

# ESKF Tuning
eskf:
  chi2_threshold_6dof: 12.592 # 95% threshold for 6 DOF
  init_pos_cov: 1e-4
  init_vel_cov: 1e-3
  init_rot_cov: 1e-4
  init_ba_cov: 1e-3
  init_bg_cov: 1e-4
  measurement_noise_pos: 0.02 # Base position std (m)
  measurement_noise_rot: 0.01 # Base rotation std (rad)

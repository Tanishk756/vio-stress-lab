name: CI/CD State-Estimation Verification Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Integration Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Run Test Suite (pytest)
        run: |
          python -m pytest tests/ -v -s

      - name: Run Benchmark Experiment Matrix
        run: |
          python run_experiment.py --synthetic --duration 12.0 --all-scenarios

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: benchmark-artifacts
          path: |
            results/benchmark_table.md
            results/ape_comparison.png
            results/plots/*.png
